name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===== 编译 & 测试 =====
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Compile
        run: mvn compile -q -DskipTests

      - name: Test
        run: mvn test

  # ===== 打包 & 发布镜像 =====
  docker:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [core, web, games, media]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Package
        run: mvn package -DskipTests -q

      - name: Build Docker image
        run: docker build -f Dockerfile-${{ matrix.module }} -t chat-${{ matrix.module }}:latest .

