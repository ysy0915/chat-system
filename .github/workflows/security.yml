name: Security Scan

on:
  schedule:
    # 每周一凌晨 2:00 UTC 自动扫描
    - cron: '0 2 * * 1'
  push:
    branches: [main, develop]
    paths:
      - '**/pom.xml'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/*.java'
      - '**/*.js'
      - '**/*.ts'
      - '**/*.yml'
      - '**/*.yaml'
  workflow_dispatch:

jobs:
  # ===================== 密钥泄露扫描 (Gitleaks) =====================
  gitleaks:
    name: Gitleaks - Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  # ===================== 依赖漏洞扫描 (OWASP) =====================
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Run Dependency-Check
        run: mvn dependency-check:aggregate -B -Dowasp.skip=false

      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30

  # ===================== Node.js 依赖漏洞 =====================
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: true

  # ===================== 汇总 =====================
  security-summary:
    name: Security Summary
    needs: [gitleaks, dependency-check, npm-audit]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report
        run: |
          echo "Gitleaks:      ${{ needs.gitleaks.result }}"
          echo "Dep-Check:     ${{ needs.dependency-check.result }}"
          echo "npm Audit:     ${{ needs.npm-audit.result }}"

          FAILURES=0
          [ "${{ needs.gitleaks.result }}" != "success" ] && ((FAILURES++))
          [ "${{ needs.dependency-check.result }}" != "success" ] && ((FAILURES++))

          if [ $FAILURES -eq 0 ]; then
            echo "✅ All security checks passed!"
          else
            echo "⚠️  $FAILURES security check(s) need attention."
          fi
