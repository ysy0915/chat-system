# chat-common 本地开发默认配置
# 生产环境配置由 Nacos 提供: chat-common-prod.yml (group: CHAT)
# 注意: 本文件会被打进各模块的依赖 jar，不要放生产敏感配置
spring:
  application:
    name: ${APP_NAME:chat-core}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/test_data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  mybatis:
    mapper-locations: classpath:mybatis/mappers/*.xml
    configuration:
      map-underscore-to-camel-case: true
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    connection-timeout: 5000ms
    requested-heartbeat: 10s
    listener:
      simple:
        auto-startup: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 5000ms
  mvc:
    async:
      request-timeout: 120000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  forward-headers-strategy: native
  port: 8081
  tomcat:
    connection-timeout: 120000
    keep-alive-timeout: 120000
    max-http-form-post-size: 10MB
    threads:
      max: 200
      min-spare: 10

# JWT
jwt:
  secret: ${JWT_SECRET:}

# SQL执行器
sql-executor:
  password: ${SQL_EXECUTOR_PASSWORD:}

# 在线人数监控
monitor:
  password: ${MONITOR_PASSWORD:}

# 阿里云内容安全
content-safety:
  enabled: true
  access-key-id: ${ALIBABA_CLOUD_ACCESS_KEY_ID:}
  access-key-secret: ${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
  endpoint: green-cip.cn-beijing.aliyuncs.com
  region-id: cn-beijing

# 阿里云 OSS 对象存储
oss:
  enabled: true
  endpoint: https://oss-cn-shanghai.aliyuncs.com
  internal-endpoint: https://oss-cn-shanghai-internal.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: aichat-0915
  public-domain: https://aichat-0915.oss-cn-shanghai.aliyuncs.com

# Actuator + Prometheus 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  tracing:
    enabled: false
    sampling:
      probability: ${TRACING_SAMPLE_RATE:0.1}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

# Resilience4j（本地开发简化配置）
resilience4j:
  circuitbreaker:
    instances:
      llm-call:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
  retry:
    instances:
      llm-retry:
        max-attempts: 3
        wait-duration: 500ms
  timelimiter:
    instances:
      llm-timeout:
        timeout-duration: 30s

# RAG 知识库（本地开发默认关闭）
app:
  module:
    core: true
  rag:
    enabled: ${RAG_ENABLED:false}
    milvus:
      enabled: ${MILVUS_ENABLED:true}
      host: ${MILVUS_HOST:127.0.0.1}
      port: 19530
      collection-prefix: kb_
      hnsw-m: 16
      hnsw-ef-construction: 200
      search-ef: 64
    embedding:
      mode: ${EMBEDDING_MODE:dashscope}
      provider: dashscope
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${EMBEDDING_MODEL:text-embedding-v4}
      dimension: ${EMBEDDING_DIMENSION:1024}
    search:
      top-k: 5
      score-threshold: 0.3
    context:
      max-chars: 3000
    upload:
      max-size: 10485760
  router:
    enabled: true
  classifier:
    enabled: true
  langchain4j:
    enabled: false
    treehole:
      enabled: false
    personal:
      enabled: false
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: ${DASHSCOPE_API_KEY:}
    model: qwen-plus
    temperature: 0.85
    timeout: 60
  langgraph4j:
    enabled: false
    debate:
      enabled: false
      rounds: 3
  observability:
    enabled: true
    trace-retention: 1000
    auto-heal: true
  agent:
    enabled: true
    max-tool-calls: 3
    default-kb-id: 1
    # ── Multi-Agent 并行工作流（TaskPlanner 指挥官 + RabbitMQ 分发）──
    planner:
      enabled: true                # 总开关
      min-length: 120              # 问题长度超过该值即触发拆解判定
      max-tasks: 5                 # 单计划最多拆解子任务数
      task-timeout-ms: 120000      # 子任务软超时（毫秒）
      max-concurrent: 8            # Worker 最大并发消费者数
      llm-judge: false             # 是否启用 LLM 二次判定（false=仅规则判定，省成本）
      retry:
        initial-delay-ms: 1000     # 失败重试初始退避（毫秒），指数 1s→2s→4s…
        max-delay-ms: 60000        # 退避上限（毫秒），与 DLQ 兜底 TTL 一致
        max-attempts: 5            # 最大执行次数（含首次），超过后回传终态失败不再重试
