spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  mybatis:
    mapper-locations: classpath:mybatis/mappers/*.xml
    configuration:
      map-underscore-to-camel-case: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 1000ms

server:
  port: 0

jwt:
  secret: test-secret-key-for-unit-testing-only-32chars
  expiration: 3600000

sql-executor:
  password: test

content-safety:
  enabled: false
  access-key-id: test
  access-key-secret: test
  endpoint: green-cip.cn-beijing.aliyuncs.com
  region-id: cn-beijing

app:
  llm:
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api-key: test-key
    model: qwen-plus
