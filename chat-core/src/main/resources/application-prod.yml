# chat-core 生产配置（部署到 Milvus 服务器）
server:
  port: 9090
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
    max-connections: 2000
    connection-timeout: 5000

spring:
  application:
    name: chat-core
  jpa:
    open-in-view: false
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        ip: 172.23.172.13
      config:
        enabled: true
        server-addr: 127.0.0.1:8848
        file-extension: yml
        group: CHAT
  datasource:
    url: jdbc:mysql://rm-bp19c29bo9s7kfyb2.mysql.rds.aliyuncs.com:3306/test_data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  data:
    redis:
      sentinel:
        master: mymaster
        nodes: 172.18.160.222:26379
      database: 0
      timeout: 5000ms
  rabbitmq:
    host: 172.18.160.222
    port: 5672
    username: chatapp
    password: ${RABBITMQ_PASSWORD:chatapp2024}
  neo4j:
    uri: bolt://127.0.0.1:7687
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:}

mybatis:
  mapper-locations: classpath:mybatis/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

# JWT（与 chat-web 保持一致）
jwt:
  secret: ${JWT_SECRET:}
  expiration: 3600000

app:
  module:
    core: true
  knowledge-graph:
    enabled: true
  cross-node:
    enabled: true
  llm:
    api-key: ${LLM_API_KEY:}
  rag:
    enabled: ${RAG_ENABLED:false}
    milvus:
      enabled: ${MILVUS_ENABLED:false}
      host: 127.0.0.1
      port: 19530
  langchain4j:
    enabled: ${LANGCHAIN4J_ENABLED:false}
  langgraph4j:
    enabled: true
    debate:
      enabled: true
      rounds: 3
  observability:
    enabled: true
  router:
    enabled: true
