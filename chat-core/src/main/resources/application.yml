# chat-core 独立配置（端口 9090）
server:
  port: 9090

spring:
  application:
    name: chat-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    url: ${DB_URL:jdbc:mysql://rm-bp19c29bo9s7kfyb2.mysql.rds.aliyuncs.com:3306/test_data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

mybatis:
  mapper-locations: classpath:mybatis/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

# AI 配置
app:
  module:
    core: true
  llm:
    api-key: ${LLM_API_KEY:}
    # ========== LLM Client 运行时配置（支持 Nacos 动态刷新） ==========
    client:
      retry:
        max-attempts: 3
        backoff-ms: 500
      timeout:
        connect-seconds: 10
        read-seconds: 60
      scenes:
        chat:
          max-tokens: 4096
          temperature: 0.7
          top-p: 1.0
          enable-tools: false
        debate:
          max-tokens: 2048
          temperature: 0.9
          top-p: 1.0
          enable-tools: false
        summary:
          max-tokens: 1024
          temperature: 0.3
          top-p: 1.0
          enable-tools: false
        treehole:
          max-tokens: 2048
          temperature: 0.8
          top-p: 1.0
          enable-tools: false
        auto:
          max-tokens: 4096
          temperature: 0.7
          top-p: 1.0
          enable-tools: false
  rag:
    enabled: ${RAG_ENABLED:false}
    embedding:
      mode: ${EMBEDDING_MODE:dashscope}
      base-url: ${EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${DASHSCOPE_API_KEY:}
      model: ${EMBEDDING_MODEL:text-embedding-v3}
      dimension: ${EMBEDDING_DIMENSION:1024}
    milvus:
      enabled: ${MILVUS_ENABLED:false}
      host: ${MILVUS_HOST:121.40.188.98}
      port: 19530
  langchain4j:
    enabled: ${LANGCHAIN4J_ENABLED:false}
    treehole:
      enabled: ${LANGCHAIN4J_TREEHOLE_ENABLED:false}
    personal:
      enabled: ${LANGCHAIN4J_PERSONAL_ENABLED:false}
  langgraph4j:
    enabled: ${LANGGRAPH4J_ENABLED:true}
    debate:
      enabled: ${LANGGRAPH4J_DEBATE_ENABLED:true}
      rounds: 3
  observability:
    enabled: ${OBSERVABILITY_ENABLED:true}
  router:
    enabled: ${ROUTER_ENABLED:true}
  # ═══ 意图识别 — 三层漏斗架构 ═══
  #   L1 规则层：关键词 Trie / 正则 / 状态机     — 0-1ms，命中率 5-15%
  #   L2 上下文层：Embedding + Milvus 语义匹配   — 30-80ms，命中率 70-85%
  #   L3 工具层：LLM 分类 + MCP 执行            — 200-1000ms，命中率 < 10%
  intent:
    enabled: ${INTENT_ENABLED:true}
    model: ${INTENT_MODEL:qwen-turbo}          # L3 LLM 分类模型（轻量快速）
    min-confidence: 0.5                          # LLM 分类置信度阈值
    timeout-seconds: 3                           # LLM 调用超时
    temperature: 0.1                             # 低温度保证分类稳定
    funnel:
      # L2 上下文层配置
      context:
        match-threshold: ${INTENT_CTX_THRESHOLD:0.75}   # 语义相似度阈值
        top-k: ${INTENT_CTX_TOPK:5}                      # k-NN 检索数量
      # 数据挖掘（从历史对话自动提取规则+示例）
      auto-extract:
        enabled: ${INTENT_AUTO_EXTRACT:false}             # 是否启用自动挖掘
        batch-size: 200                                   # 每次处理的消息数
        schedule-cron: ${INTENT_EXTRACT_CRON:0 0 3 * * ?} # 每天凌晨 3 点执行

# 内部 API 不需要 Security
security:
  internal:
    enabled: false

springdoc:
  api-docs:
    path: /internal/v3/api-docs
  swagger-ui:
    path: /internal/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
