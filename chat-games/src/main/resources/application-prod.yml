server:
  port: 8083
  tomcat:
    threads:
      max: 30
      min-spare: 5
    accept-count: 30
    max-connections: 300
    connection-timeout: 5000

spring:
  application:
    name: chat-games
  jpa:
    open-in-view: false
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        ip: 172.23.172.13
  datasource:
    url: jdbc:mysql://rm-bp19c29bo9s7kfyb2.mysql.rds.aliyuncs.com:3306/test_data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
