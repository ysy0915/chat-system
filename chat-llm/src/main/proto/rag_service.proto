syntax = "proto3";

package com.example.chat.llm.grpc;

import "common.proto";

option java_multiple_files = true;
option java_package = "com.example.chat.llm.grpc";

// ---- 统一 RAG 服务 (检索增强生成) ----

service LlmRagService {
  // 一键 RAG 调用：检索 + 生成
  rpc RAGInvoke (RAGRequest) returns (RAGResponse);

  // 仅检索 (返回文档片段)
  rpc Retrieve (RetrieveRequest) returns (RetrieveResponse);

  // 文档入库
  rpc Ingest (IngestRequest) returns (IngestResponse);

  // 删除文档
  rpc DeleteDocument (DeleteDocumentRequest) returns (IngestResponse);
}

// ---- 一键 RAG =========

message RAGRequest {
  string provider = 1;          // LLM 提供商 (为空则通过 dataSource 解析)
  string model = 2;             // LLM 模型 (为空则用 dataSource 默认)
  repeated Message messages = 3; // 对话消息
  double temperature = 4;
  int32 max_tokens = 5;
  string system_prompt = 6;      // 可追加检索结果的占位符 {context}
  int32 top_k = 7;               // 检索片段数，默认 3
  float score_threshold = 8;     // 相似度阈值，默认 0.5
  string knowledge_base_id = 9;  // 知识库 ID (可空)
  string query = 10;             // 显式检索查询 (为空则用最后一条 user 消息)
  repeated string filter_tags = 11;  // 文档标签过滤
  string data_source = 12;       // 数据源名称 → DataSourceRegistry.get(name)
}

message RAGResponse {
  bool success = 1;
  string content = 2;            // AI 回复
  string provider = 3;
  string model = 4;
  int32 total_tokens = 5;
  int32 prompt_tokens = 6;
  int32 completion_tokens = 7;
  int64 elapsed_ms = 8;
  string error = 9;
  repeated RetrievedDoc sources = 10;  // 引用来源
  string data_source = 11;             // 实际使用的数据源
}

// ---- 仅检索 =========

message RetrieveRequest {
  string query = 1;               // 查询文本
  int32 top_k = 2;                // 默认 5
  float score_threshold = 3;
  string knowledge_base_id = 4;
  repeated string filter_tags = 5;
  string data_source = 6;         // 数据源名称
}

message RetrievedDoc {
  string doc_id = 1;
  string doc_name = 2;
  string chunk_text = 3;
  float score = 4;
  int32 chunk_index = 5;
}

message RetrieveResponse {
  bool success = 1;
  repeated RetrievedDoc results = 2;
  int32 total = 3;
  int64 elapsed_ms = 4;
  string error = 5;
}

// ---- 文档入库 =========

message IngestRequest {
  string knowledge_base_id = 1;       // 知识库 ID
  string doc_name = 2;                // 文档名称
  bytes content = 3;                  // 文档二进制内容
  string content_type = 4;            // text/plain | application/pdf | application/vnd.openxmlformats-officedocument.wordprocessingml.document
  int32 chunk_size = 5;               // 分块大小 (字符数)，默认 500
  int32 chunk_overlap = 6;            // 分块重叠，默认 50
  map<string, string> metadata = 7;   // 自定义元数据
  repeated string tags = 8;           // 标签
  string embedding_provider = 9;      // embedding 提供商，默认 dashscope
  string embedding_model = 10;        // embedding 模型
  string data_source = 11;            // 入库目标数据源
}

message IngestResponse {
  bool success = 1;
  string doc_id = 2;
  int32 chunk_count = 3;
  int64 elapsed_ms = 4;
  string error = 5;
}

message DeleteDocumentRequest {
  string doc_id = 1;
  string knowledge_base_id = 2;
  string data_source = 3;             // 数据源名称
}
