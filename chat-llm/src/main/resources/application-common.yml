# chat-llm 共享配置：local 与 standalone 两个 profile 均通过 spring.config.import 引入
# 注意：本文件为默认值，profile 主文件（application.yml / application-standalone.yml）优先级更高，可覆盖

# gRPC（可选，不需要可设为 -1 关闭）
grpc:
  server:
    port: ${GRPC_PORT:9195}

# LLM 多 Provider 网关配置（只需配对应 API Key）
llm:
  invoke-timeout-seconds: 120
  max-retries: 2
  retry-backoff-millis: 1000
  providers:
    - name: deepseek
      type: rest
      base-url: https://api.deepseek.com
      path: /chat/completions
      api-key: ${DEEPSEEK_API_KEY:}
      models:
        - deepseek-chat
        - deepseek-reasoner
    - name: qwen
      type: rest
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      path: /v1/chat/completions
      api-key: ${QWEN_API_KEY:}
      models:
        - qwen-plus
        - qwen-max
        - qwen-turbo
    - name: doubao
      type: rest
      base-url: https://ark.cn-beijing.volces.com/api/v3
      path: /chat/completions
      api-key: ${DOUBAO_API_KEY:}
      models:
        - doubao-seed-2-0-pro-260215
        - doubao-seed-2-0-lite-260215
    # 示例：OpenAI 官方
    # - name: openai
    #   type: rest
    #   base-url: https://api.openai.com
    #   path: /v1/chat/completions
    #   api-key: ${OPENAI_API_KEY:}
    #   models:
    #     - gpt-4o
    #     - gpt-4o-mini
    # 示例：Ollama 本地模型
    # - name: ollama
    #   type: rest
    #   base-url: http://127.0.0.1:11434
    #   path: /v1/chat/completions
    #   api-key: ollama
    #   models:
    #     - llama3
    #     - qwen2.5

# Resilience4j 熔断/重试/限流
resilience4j:
  circuitbreaker:
    instances:
      llm-cb-default:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
  retry:
    instances:
      llm-retry-default:
        max-attempts: 3
        wait-duration: 500ms
  ratelimiter:
    instances:
      llm-rate-default:
        limit-for-period: 10
        limit-refresh-period: 1s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,retries,ratelimiters
  endpoint:
    health:
      show-details: always

# Logging（策略包 DEBUG 等增量开关在各 profile 内补充）
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-N/A}] %logger{36} - %msg%n"
  level:
    com.example.chat.llm: DEBUG
