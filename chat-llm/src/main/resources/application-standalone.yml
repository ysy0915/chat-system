# chat-llm Standalone 模式配置
# 不依赖 Nacos / MySQL / Redis / RabbitMQ / Neo4j / Milvus
# 只需配置 LLM API Key 即可启动
#
# 启动方式：
#   java -jar chat-llm.jar --spring.profiles.active=standalone
#
# 环境变量：
#   DEEPSEEK_API_KEY=sk-xxx
#   QWEN_API_KEY=sk-xxx
#   DOUBAO_API_KEY=xxx

server:
  port: ${SERVER_PORT:9095}

spring:
  application:
    name: chat-llm
  autoconfigure:
    # 排除不需要的自动配置（无 MySQL/Redis/RabbitMQ/Neo4j）
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jReactiveDataAutoConfiguration
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
      - org.springframework.boot.autoconfigure.transaction.TransactionAutoConfiguration
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

# gRPC（可选，不需要可设为 -1 关闭）
grpc:
  server:
    port: ${GRPC_PORT:9195}

# RAG / 知识图谱 / 对话记忆 — 全部启用，纯内存实现（app.rag.backend=memory / app.knowledge-graph.backend=memory）
# 模型管理面（DB CRUD）— 纯内存实现（app.llm.admin.memory=true），可用 /api/v1/llm/admin/providers 自助接入模型
# 向量化需要外部 Embedding API：可复用 LLM API Key（DashScope）或单独配置 EMBEDDING_API_KEY
app:
  rag:
    enabled: true
    backend: memory
    embedding:
      provider: dashscope
      mode: dashscope
      base-url: https://dashscope.aliyuncs.com/api/v1
      api-key: ${EMBEDDING_API_KEY:${QWEN_API_KEY:}}
      model: text-embedding-v3
      dimension: 1024
  knowledge-graph:
    enabled: true
    backend: memory
  llm:
    admin:
      memory: true
  security:
    enabled: false
  # standalone 无 DB：关闭 MyBatis Mapper 扫描（模型管理面/知识库仓储由内存实现接管）
  mapper-scan:
    enabled: false

# LLM 配置 — 只需配 API Key
llm:
  invoke-timeout-seconds: 120
  max-retries: 2
  retry-backoff-millis: 1000
  providers:
    - name: deepseek
      type: rest
      base-url: https://api.deepseek.com
      path: /chat/completions
      api-key: ${DEEPSEEK_API_KEY:}
      models:
        - deepseek-chat
        - deepseek-reasoner
    - name: qwen
      type: rest
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      path: /v1/chat/completions
      api-key: ${QWEN_API_KEY:}
      models:
        - qwen-plus
        - qwen-max
        - qwen-turbo
    - name: doubao
      type: rest
      base-url: https://ark.cn-beijing.volces.com/api/v3
      path: /chat/completions
      api-key: ${DOUBAO_API_KEY:}
      models:
        - doubao-seed-2-0-pro-260215
        - doubao-seed-2-0-lite-260215
    # 示例：OpenAI 官方
    # - name: openai
    #   type: rest
    #   base-url: https://api.openai.com
    #   path: /v1/chat/completions
    #   api-key: ${OPENAI_API_KEY:}
    #   models:
    #     - gpt-4o
    #     - gpt-4o-mini
    # 示例：Ollama 本地模型
    # - name: ollama
    #   type: rest
    #   base-url: http://127.0.0.1:11434
    #   path: /v1/chat/completions
    #   api-key: ollama
    #   models:
    #     - llama3
    #     - qwen2.5

# Resilience4j 熔断/重试/限流
resilience4j:
  circuitbreaker:
    instances:
      llm-cb-default:
        failure-rate-threshold: 50
        sliding-window-size: 10
        minimum-number-of-calls: 5
  retry:
    instances:
      llm-retry-default:
        max-attempts: 3
        wait-duration: 500ms
  ratelimiter:
    instances:
      llm-rate-default:
        limit-for-period: 10
        limit-refresh-period: 1s

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,circuitbreakers,retries,ratelimiters
  endpoint:
    health:
      show-details: always

# Security — standalone 模式关闭认证
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-N/A}] %logger{36} - %msg%n"
  level:
    com.example.chat.llm: DEBUG
    com.example.chat.llm.strategy: DEBUG
