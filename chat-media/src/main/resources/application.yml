# chat-media 配置
spring:
  application:
    name: chat-media
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import:
      - optional:nacos:chat-common-${spring.profiles.active}.yml?group=CHAT&refreshEnabled=true
      - optional:nacos:chat-media-${spring.profiles.active}.yml?group=CHAT&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        enabled: ${NACOS_ENABLED:false}
        ip: ${NACOS_IP:}
      config:
        enabled: ${NACOS_ENABLED:false}
        file-extension: yml
        group: CHAT

springdoc:
  api-docs:
    path: /media/v3/api-docs
  swagger-ui:
    path: /media/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
