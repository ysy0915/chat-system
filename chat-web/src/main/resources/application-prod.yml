# chat-web 生产配置（部署到 Milvus 服务器）
server:
  port: 8080
  tomcat:
    threads:
      max: 50
      min-spare: 10
    accept-count: 50
    max-connections: 500
    connection-timeout: 5000

spring:
  application:
    name: chat-web
  jpa:
    open-in-view: false
  cloud:
    nacos:
      discovery:
        enabled: true
        server-addr: 127.0.0.1:8848
        ip: 172.23.172.13
  datasource:
    url: jdbc:mysql://rm-bp19c29bo9s7kfyb2.mysql.rds.aliyuncs.com:3306/test_data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
  data:
    redis:
      sentinel:
        master: mymaster
        nodes: 172.18.160.222:26379
      database: 0
      timeout: 5000ms
  rabbitmq:
    host: 172.18.160.222
    port: 5672
    username: chatapp
    password: ${RABBITMQ_PASSWORD:}

mybatis:
  mapper-locations: classpath:mybatis/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true

# JWT（必须与 chat-core 一致）
jwt:
  secret: ${JWT_SECRET:}
  expiration: 3600000

app:
  core:
    base-url: http://127.0.0.1:9090
  module:
    core: false
  cross-node:
    enabled: true
