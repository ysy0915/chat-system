# 集成测试专用配置：H2 替代 MySQL、关闭 Nacos/RabbitMQ，外部 IO 依赖由 @MockBean 提供
spring:
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# 排除需要 RabbitMQ 的组件（RabbitConfig / IdleSessionCleanupTask）
app:
  module:
    core: false
  cross-node:
    enabled: false
  safety:
    enabled: false
