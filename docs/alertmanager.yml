# 生产环境 Alertmanager 配置（Milvus 服务器 your-milvus-ip）
# 容器启动参数必须带 --cluster.listen-address= 禁用集群端口，否则会抢占 9094
route:
  group_by: ["alertname", "job", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "webhook"

receivers:
  - name: "webhook"
    webhook_configs:
      - url: "http://127.0.0.1:9950/hook"
        send_resolved: true
