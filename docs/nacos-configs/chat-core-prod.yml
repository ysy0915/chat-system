# chat-core 专属生产配置（公共配置在 chat-common-prod.yml）
server:
  port: 9090
  tomcat:
    threads:
      max: 200
      min-spare: 20
    accept-count: 200
    max-connections: 2000
    connection-timeout: 5000

spring:
  datasource:
    hikari:
      maximum-pool-size: 30
  jpa:
    open-in-view: false
  rabbitmq:
    listener:
      simple:
        concurrency: 10
        max-concurrency: 20
        prefetch: 1
  neo4j:
    uri: bolt://127.0.0.1:7687
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:}

app:
  module:
    core: true
  knowledge-graph:
    enabled: true
  cross-node:
    enabled: true
  llm:
    api-key: ${LLM_API_KEY:}
    bundle:
      enabled: ${LLM_BUNDLE_ENABLED:false}
      base-url: ${LLM_BUNDLE_BASE_URL:http://127.0.0.1:9095}
      timeout: ${LLM_BUNDLE_TIMEOUT:120s}
    client:
      retry:
        max-attempts: 3
        backoff-ms: 500
      timeout:
        connect-seconds: 10
        read-seconds: 60
      scenes:
        chat:
          max-tokens: 4096
          temperature: 0.7
          top-p: 1.0
          enable-tools: false
        debate:
          max-tokens: 2048
          temperature: 0.9
          top-p: 1.0
          enable-tools: false
        summary:
          max-tokens: 1024
          temperature: 0.3
          top-p: 1.0
          enable-tools: false
        treehole:
          max-tokens: 2048
          temperature: 0.8
          top-p: 1.0
          enable-tools: false
        auto:
          max-tokens: 4096
          temperature: 0.7
          top-p: 1.0
          enable-tools: false
  llm-service:
    base-url: ${LLM_SERVICE_BASE_URL:http://127.0.0.1:9095}
  rag:
    embedding:
      model: ${EMBEDDING_MODEL:text-embedding-v3}
  langchain4j:
    enabled: ${LANGCHAIN4J_ENABLED:false}
    treehole:
      enabled: ${LANGCHAIN4J_TREEHOLE_ENABLED:false}
    personal:
      enabled: ${LANGCHAIN4J_PERSONAL_ENABLED:false}
  langgraph4j:
    enabled: ${LANGGRAPH4J_ENABLED:true}
    debate:
      enabled: ${LANGGRAPH4J_DEBATE_ENABLED:true}
      rounds: 3
  agent:
    planner:
      enabled: true
      min-length: 120
      max-tasks: 9
      task-timeout-ms: 120000
      max-concurrent: 8
      converge-max-chars: 1000
      converge-model: qwen-turbo
      reconcile-interval-ms: 30000
      llm-judge: false
      retry:
        initial-delay-ms: 1000
        max-delay-ms: 60000
        max-attempts: 5
  intent:
    enabled: ${INTENT_ENABLED:true}
    model: ${INTENT_MODEL:qwen-turbo}
    min-confidence: 0.5
    timeout-seconds: 3
    temperature: 0.1
    funnel:
      context:
        match-threshold: ${INTENT_CTX_THRESHOLD:0.75}
        top-k: ${INTENT_CTX_TOPK:5}
      auto-extract:
        enabled: ${INTENT_AUTO_EXTRACT:false}
        batch-size: 200
        schedule-cron: ${INTENT_EXTRACT_CRON:0 0 3 * * ?}

security:
  internal:
    enabled: false

springdoc:
  api-docs:
    path: /internal/v3/api-docs
  swagger-ui:
    path: /internal/swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
