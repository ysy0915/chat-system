server {
    server_name  yangsy.online;

    client_max_body_size 50m;
    server_tokens off;

    # 与仓库 nginx.conf(8080 server) 语义一致：root 为 /opt/app/static，
    # 前端 base 为 /chat/，故 /chat/assets/* -> /opt/app/static/chat/assets/*
    root /opt/app/static;
    index /chat/index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带指纹的静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由兜底与 html 入口一律不缓存（发版即生效）
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /chat/index.html;
    }
    location = /chat/index.html {
        add_header Cache-Control "no-cache";
    }

    # 多模态服务 → 应用服务器 chat-media (8084)（2026-10-04 修复：此前缺失，404）
    location /api/v1/media/ {
        proxy_pass http://47.110.234.58:8084;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 小游戏服务 → 应用服务器 chat-games (8083)
    location /api/v1/games/ {
        proxy_pass http://47.110.234.58:8083;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SQL 执行器 → 应用服务器 chat-games (8083)（2026-10-04 修复：此前缺失，/api/v1/sql/** 落到通用 /api/ → chat-web 404）
    location /api/v1/sql/ {
        proxy_pass http://47.110.234.58:8083;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 游戏实时对战 WebSocket
    location /ws/games {
        proxy_pass http://47.110.234.58:8083/ws/chat;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API 与 WebSocket 反代到应用服务器 47.110.234.58
    location /api/ {
        proxy_pass http://47.110.234.58:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /ws/ {
        proxy_pass http://47.110.234.58:8081;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/yangsy.online/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/yangsy.online/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = yangsy.online) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  yangsy.online;
    return 404; # managed by Certbot


}