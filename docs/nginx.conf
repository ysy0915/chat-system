# 生产环境 Nginx 配置（主服务器 your-nginx-ip）
# 后端 Java 服务全部在 Milvus 服务器 your-milvus-ip（内网 your-intra-ip）
# 此文件为参考配置；线上实际配置按服务器 /etc/nginx/ 为准，部署时需同步以下要点
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 4096;   # 1024 → 4096：支撑 1000+ 并发
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    include /etc/nginx/conf.d/*.conf;

    # 后端节点池（双 web 实例，ip_hash 保证 WebSocket 会话粘性）
    # max_fails=2: 5秒内失败2次标记不可用；fail_timeout=5s: 5秒后重试该节点是否恢复
    # 注意：生产必须用内网地址 your-intra-ip（主服务器到 Milvus 服务器的内网 IP），不是 127.0.0.1
    upstream backend_nodes {
        ip_hash;
        server your-intra-ip:8081 max_fails=2 fail_timeout=5s;
        server your-intra-ip:8082 max_fails=2 fail_timeout=5s;
        keepalive 64;                       # 连接池复用，避免每次请求新建 TCP
    }

    server {
        listen       80 default_server;
        listen       [::]:80 default_server;
        server_name  _;

        client_max_body_size 50m;

        # ============================================================
        # 安全响应头 (Security Headers)
        # ============================================================

        # 1. HSTS - 强制 HTTPS (仅生产环境 HTTPS 后启用)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 2. X-Content-Type-Options - 禁止 MIME 类型嗅探
        add_header X-Content-Type-Options "nosniff" always;

        # 3. X-Frame-Options - 禁止被嵌入 iframe (防 Clickjacking)
        add_header X-Frame-Options "DENY" always;

        # 4. X-XSS-Protection - 启用浏览器 XSS 过滤器
        add_header X-XSS-Protection "1; mode=block" always;

        # 5. Referrer-Policy - 跨域请求时不发送完整 Referrer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 6. Permissions-Policy - 限制浏览器 API 使用
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # 7. Cache-Control - 静态资源缓存 (30天)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # 8. 隐藏 Nginx 版本号
        server_tokens off;

        # 9. 禁止非标准请求方法 (只允许 GET/POST/PUT/DELETE/HEAD)
        if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS|PATCH)$) {
            return 405;
        }

        location / {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # 5秒连不上就切换到另一个节点
            proxy_connect_timeout 5s;

            # 节点失败时自动重试到另一个节点
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
