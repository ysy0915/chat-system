# 生产环境 Prometheus 告警规则（已部署于 Milvus 服务器 /opt/app/prometheus/alerts.yml）
# 依赖：各服务暴露 /actuator/prometheus（micrometer-registry-prometheus 必须用 1.11.6，
#       1.13.0 与 Boot 3.1.6 不兼容会导致 PrometheusMeterRegistry 初始化失败、端点 404）
# 通知链路：Prometheus → Alertmanager :9093 → alert-webhook :9950 → 钉钉（DINGTALK_WEBHOOK）
groups:
  - name: chat-system-availability
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "服务 {{ $labels.job }} 不可用"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 已持续 2 分钟不可达"

  - name: chat-system-resource
    rules:
      # 宿主机可用内存 < 8% → 真实触发过（内存治理 P0 的依据）
      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.08
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "宿主机可用内存不足 8%"
          description: "{{ $labels.instance }} 可用内存低于 8%，持续 5 分钟，请清理进程或升内存"

      - alert: DiskWillFill
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "根分区磁盘剩余不足 15%"
          description: "{{ $labels.instance }} 根分区可用空间低于 15%，持续 10 分钟"

      - alert: HighJvmMemory
        expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 堆内存使用率过高"
          description: "{{ $labels.job }} ({{ $labels.instance }}) 堆内存使用率超过 85%，持续 10 分钟"

      - alert: HighCpu
        expr: process_cpu_usage > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} CPU 使用率过高"
          description: "{{ $labels.job }} ({{ $labels.instance }}) CPU 使用率超过 90%，持续 10 分钟"

      - alert: HighSystemLoad
        expr: node_load1 > 4
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "服务器负载过高"
          description: "{{ $labels.instance }} 1 分钟负载超过 4，持续 10 分钟"

  - name: chat-system-latency
    rules:
      - alert: HighHttpLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le, uri, job)) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "接口 {{ $labels.uri }} 高延迟"
          description: "{{ $labels.job }} 的接口 {{ $labels.uri }} P95 延迟超过 3 秒，持续 5 分钟"

  - name: chat-system-errors
    rules:
      - alert: HighHttpErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) by (job)
            / sum(rate(http_server_requests_seconds_count[5m])) by (job) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 5xx 错误率过高"
          description: "{{ $labels.job }} 5xx 错误率超过 5%，持续 5 分钟"

  # ── 业务级指标（2026-08-13 上线，补齐告警覆盖的业务维度）──
  # 数据源：chat-core 双实例（9090/9092）的 core.intent.funnel.* / core.agent.workflow.*
  #         （CoreBusinessMetrics，经 chat-common 传递依赖 micrometer 1.11.6 无需新依赖）
  #         chat-llm（9095）的 llm.invoke.tokens（LlmMetrics 既有埋点）
  # 阈值均为初始值，按实际流量基线调整。
  - name: chat-system-business
    rules:
      - alert: IntentFunnelHitRateLow
        expr: |
          sum(rate(core_intent_funnel_hits_total{layer=~"L1|L2"}[15m])) by (instance)
            / sum(rate(core_intent_funnel_hits_total[15m])) by (instance) < 0.85
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "意图漏斗 L1+L2 综合命中率过低"
          description: "{{ $labels.instance }} L1+L2 综合命中率低于 85%（目标 ≥95%），持续 15 分钟，多为语义理解退化、规则失效或语料漂移"

      - alert: AgentWorkflowDegradeHigh
        expr: |
          sum(rate(core_agent_workflow_started_total{status="degraded"}[15m])) by (instance)
            / sum(rate(core_agent_workflow_started_total[15m])) by (instance) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Multi-Agent 工作流降级率过高"
          description: "{{ $labels.instance }} 并行工作流降级（并发过载/计划失败）占比超过 50%，持续 15 分钟，请检查 max-concurrent 与 TaskPlanner 计划成功率"

      - alert: AgentWorkflowConvergeFail
        expr: sum(rate(core_agent_workflow_converged_total{status="failed"}[10m])) by (instance) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Multi-Agent 收敛失败"
          description: "{{ $labels.instance }} 出现工作流收敛失败，持续 10 分钟，请查看 core 日志 [MultiAgent] 收敛失败"

      - alert: LLMTokenSurge
        expr: sum(rate(llm_invoke_tokens_total{type="completion"}[5m])) by (model) > 5000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "模型 {{ $labels.model }} 输出 token 激增"
          description: "{{ $labels.model }} completion token 速率超过 5000/s，持续 10 分钟，请检查是否存在异常重试/超长输出循环（LLM 成本异常信号）"
