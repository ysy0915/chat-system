# 生产环境 Prometheus 配置（已部署于 Milvus 服务器 121.40.188.98 /opt/app/prometheus/prometheus.yml）
# 监控栈以 --network host 容器运行：Prometheus UI :9094（9090 被主 core 占用）
# host 网络模式下直接用 127.0.0.1 访问宿主机上的各 Java 服务与中间件
# 权威源：服务器实测配置，修改时先改服务器再同步回仓库（2026-08-16 同步：新增 blackbox-tcp 探测 Milvus + 清理废弃 8082）
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'chat-system'

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

scrape_configs:
  # 服务器主机指标（内存/CPU/磁盘/网络）
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  # Java 服务 JVM 指标（heap/GC/线程/HTTP）
  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:9090', '127.0.0.1:9092']
        labels:
          service: chat-core

  - job_name: web
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:8081']
        labels:
          service: chat-web

  # 健康探测（blackbox_exporter http_2xx）
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://127.0.0.1:9090/actuator/health'
          - 'http://127.0.0.1:9092/actuator/health'
          - 'http://127.0.0.1:8081/actuator/health'
          - 'http://127.0.0.1:8083/actuator/health'
          - 'http://127.0.0.1:8084/actuator/health'
          - 'http://127.0.0.1:8848/nacos/'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - replacement: '127.0.0.1:9115'
        target_label: __address__

  # chat-llm 业务指标（LLMTokenSurge 数据源，2026-08-13 补充）
  - job_name: chat-llm
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:9095']

  # Milvus 向量库存活探测（tcp_connect 探测 gRPC 端口 19530，2026-08-16 补充）
  # 背景：修复 milvus-etcd/minio 退出导致 RAG 故障 3 天未被发现的监控盲区
  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - '127.0.0.1:19530'
        labels:
          service: milvus
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - replacement: '127.0.0.1:9115'
        target_label: __address__
