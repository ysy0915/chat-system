# 前端独立 Nginx 配置（用于容器化部署）
server {
    listen 80;
    server_name _;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml;

    # 静态资源长缓存
    location /chat/assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 图片/字体缓存
    location ~* \.(png|jpg|jpeg|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
    }

    # HTML 不缓存
    location = /chat/ {
        root /usr/share/nginx/html;
        try_files /chat/index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /chat/index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://backend/chat/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # WebSocket 反向代理
    location /ws/ {
        proxy_pass http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        root /usr/share/nginx/html;
        index /chat/index.html;
        try_files $uri $uri/ /chat/index.html;
    }
}
