worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # chat-llm 双实例负载均衡（9095/9096），core 经 8095 接入
    upstream llm_backend {
        server host.docker.internal:9095 max_fails=2 fail_timeout=5s;
        server host.docker.internal:9096 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 8095;

        location / {
            proxy_pass http://llm_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE 流式（/api/v1/chain/stream、/api/v1/chain/graph/stream）必须关闭缓冲
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_connect_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
