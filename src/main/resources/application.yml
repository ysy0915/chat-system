spring:
  application:
    name: big-data-engine
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/test_data?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:YangSy@0915!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  mybatis:
    mapper-locations: classpath:mybatis/mappers/*.xml
    configuration:
      map-underscore-to-camel-case: true
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: /
    connection-timeout: 5000ms
    requested-heartbeat: 10s
    listener:
      simple:
        auto-startup: false
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    timeout: 5000ms
  mvc:
    async:
      request-timeout: 120000

server:
  forward-headers-strategy: native
  port: 8081
  tomcat:
    connection-timeout: 120000
    keep-alive-timeout: 120000
    max-http-form-post-size: 10MB
    threads:
      max: 200
      min-spare: 10

