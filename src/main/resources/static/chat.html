<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博思 — 模型选择</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  <style>
    body { padding: 2rem; background:#f8f9fa }
    .chat-box { max-width:900px; margin:0 auto }
    .messages { height:360px; background:#fff; border:1px solid #dee2e6; padding:1rem; overflow:auto; white-space:pre-wrap }
    .meta { font-size:0.9rem }
  </style>
</head>
<body>
<div class="chat-box">
  <div class="card mb-3">
    <div class="card-body">
      <h4 class="card-title">聊天（模型可选）</h4>
      <div class="row g-2 align-items-center">
        <div class="col-auto">
          <label class="col-form-label">User ID</label>
        </div>
        <div class="col-auto">
          <input id="userId" class="form-control" value="1" style="width:100px" />
        </div>
        <div class="col-auto">
          <label class="col-form-label">模型</label>
        </div>
        <div class="col-auto" style="min-width:250px">
          <select id="modelSelect" class="form-select"></select>
        </div>
        <div class="col-auto">
          <button id="refresh" class="btn btn-outline-secondary">刷新模型列表</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <div class="card-body">
      <textarea id="question" class="form-control" rows="4" placeholder="在此输入问题..."></textarea>
      <div class="d-flex justify-content-end mt-2">
        <button id="send" class="btn btn-primary">发送</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h5 class="card-title">流式结果</h5>
      <div id="outMeta" class="meta text-muted mb-2">未连接</div>
      <div id="out" class="messages"></div>
    </div>
  </div>
</div>

<script>
async function fetchModels(){
  try{
    const res = await fetch('/api/v1/models');
    if(!res.ok){ console.error('获取模型失败', res.status); return; }
    const models = await res.json();
    const sel = document.getElementById('modelSelect');
    sel.innerHTML='';
    models.forEach(m=>{
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.text = `${m.provider} / ${m.model}`;
      sel.appendChild(opt);
    });
  }catch(e){ console.error(e); }
}

let stompClient=null;
function connect(userId){
  const outMeta = document.getElementById('outMeta');
  if(stompClient && stompClient.connected) { outMeta.textContent = '已连接'; return; }
  outMeta.textContent = '连接中...';
  const socket = new SockJS('/ws/chat');
  stompClient = Stomp.over(socket);
  stompClient.connect({}, function(frame){
    outMeta.textContent = '已连接';
    stompClient.subscribe('/topic/user.'+userId, function(msg){
      const p = JSON.parse(msg.body);
      const out = document.getElementById('out');
      if(p.type === 'chunk'){
        out.textContent += p.content;
        out.scrollTop = out.scrollHeight;
      } else if(p.type === 'done' || p.type==='cache_hit'){
        out.textContent += '\n[DONE]\n' + (p.answer||'') + '\n';
        out.scrollTop = out.scrollHeight;
      } else if(p.type === 'error'){
        out.textContent += '\n[ERROR] ' + p.message + '\n';
        out.scrollTop = out.scrollHeight;
      }
    });
  }, function(err){
    outMeta.textContent = '连接失败';
    console.error('STOMP err', err);
  });
}

async function sendMessage(){
  const sendBtn = document.getElementById('send');
  sendBtn.disabled = true;
  const userId = document.getElementById('userId').value;
  connect(userId);
  const question = document.getElementById('question').value;
  const preferred = document.getElementById('modelSelect').value;
  const body = { req_id: null, question: question, user_id: parseInt(userId), preferred_model_config_id: parseInt(preferred) };
  try{
    const r = await fetch('/api/v1/messages',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const out = document.getElementById('out');
    if(r.ok){
      const data = await r.json();
      out.textContent = '[请求已发送] ' + JSON.stringify(data) + '\n';
    } else {
      let text;
      try{ text = await r.text(); } catch(e){ text = String(e); }
      out.textContent = '[错误] HTTP ' + r.status + ' - ' + text + '\n';
    }
  }catch(e){
    const out = document.getElementById('out');
    out.textContent = '[异常] ' + e + '\n';
  } finally{ sendBtn.disabled = false; }
}

document.getElementById('refresh').onclick = fetchModels;
document.getElementById('send').onclick = sendMessage;

fetchModels();
</script>
</body>
</html>
